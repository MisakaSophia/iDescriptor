[package]
name = "zupdater"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_builder = "0.20"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
url = "2"

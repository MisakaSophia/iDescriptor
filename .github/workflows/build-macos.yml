name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (for example, v1.2.3)"
        required: true
        default: "v0.0.0"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Build version (for example, v1.2.3)"
        required: true
        type: string

env:
  QT_VERSION: "6.9.2"
  LIBPLIST_VER: "2.7.0"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate release credentials
        env:
          DEV_ID_P12_BASE64: ${{ secrets.DEV_ID_P12_BASE64 }}
          DEV_ID_P12_PASSWORD: ${{ secrets.DEV_ID_P12_PASSWORD }}
          DEV_IDENTITY_NAME: ${{ secrets.DEV_IDENTITY_NAME }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_APP_SPECIFIC_PASS: ${{ secrets.NOTARIZE_APP_SPECIFIC_PASS }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DEV_ID_P12_BASE64
            DEV_ID_P12_PASSWORD
            DEV_IDENTITY_NAME
            NOTARIZE_APPLE_ID
            NOTARIZE_APP_SPECIFIC_PASS
            NOTARIZE_TEAM_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required release secret: ${name}"
              exit 1
            fi
          done

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtmultimedia qtlocation qtpositioning qtserialport qt5compat qtshadertools"

      - name: Update build paths
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}/lib/cmake:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            create-dmg \
            curl \
            ffmpeg \
            gst-libav \
            gst-plugins-bad \
            gst-plugins-base \
            gst-plugins-good \
            gst-plugins-ugly \
            gstreamer \
            jpeg-xl \
            libheif \
            meson \
            ninja \
            openssl \
            sqlite

      - name: Build qml6glsink
        shell: bash
        run: |
          set -euo pipefail
          version="$(pkg-config --modversion gstreamer-1.0)"
          archive="gst-plugins-good-${version}.tar.xz"
          source_url="https://gstreamer.freedesktop.org/src/gst-plugins-good"

          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output "$archive" \
            "${source_url}/${archive}"
          curl --fail --location --retry 3 --output "${archive}.sha256sum" \
            "${source_url}/${archive}.sha256sum"
          shasum -a 256 --check "${archive}.sha256sum"
          tar -xf "$archive"
          cd "gst-plugins-good-${version}"

          meson setup build-qml6 . \
            --auto-features=disabled \
            -Dqt-method=qmake \
            -Dqt6=enabled \
            -Dqt5=disabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dnls=disabled
          ninja -C build-qml6

          plugin_dir="$(brew --prefix)/lib/gstreamer-1.0"
          cp build-qml6/ext/qt6/libgstqml6.dylib "$plugin_dir/"
          gst-inspect-1.0 qml6glsink >/dev/null

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build libimobiledevice suite
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/idescriptor-libs"
          mkdir -p "$tmp"
          cd "$tmp"
          base_url="https://github.com/libimobiledevice"
          libs=(libplist)

          for name in "${libs[@]}"; do
            ver_var=$(echo "$name" | tr '[:lower:]' '[:upper:]' | sed 's/-/_/g')_VER
            ver="${!ver_var:-}"
            if [ -z "$ver" ]; then
              echo "Version for $name not set (environment variable $ver_var)"
              exit 1
            fi
            archive="${name}-${ver}.tar.bz2"
            curl --retry 3 --retry-delay 5 -L -o "$archive" \
              "${base_url}/${name}/releases/download/${ver}/${archive}"
            tar xjf "$archive"
            pushd "${name}-${ver}"
            ./configure
            make -j"$(sysctl -n hw.ncpu)"
            sudo make install
            popd
          done

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DEV_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEV_ID_P12_PASSWORD }}

      - name: Build with Cargo
        run: RUSTFLAGS="" cargo build --release

      - name: Deploy and create DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.DEV_IDENTITY_NAME }}
        run: bash packaging/macos/dmg/deploy.sh "${{ matrix.arch }}" "${{ inputs.version }}"

      - name: Verify signed artifacts
        run: |
          dmg="build/iDescriptor-${{ inputs.version }}-${{ matrix.arch == 'x86_64' && 'Apple_Intel' || 'Apple_Silicon' }}.dmg"
          codesign --verify --deep --strict --verbose=2 build/iDescriptor.app
          codesign --verify --strict --verbose=2 "$dmg"

      - name: Notarize DMG
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_APP_SPECIFIC_PASS: ${{ secrets.NOTARIZE_APP_SPECIFIC_PASS }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
        run: |
          dmg="build/iDescriptor-${{ inputs.version }}-${{ matrix.arch == 'x86_64' && 'Apple_Intel' || 'Apple_Silicon' }}.dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --password "$NOTARIZE_APP_SPECIFIC_PASS" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - name: Validate DMG
        run: |
          file build/iDescriptor.app/Contents/MacOS/iDescriptor | grep -q "${{ matrix.arch }}"
          plutil -lint build/iDescriptor.app/Contents/Info.plist
          test -f build/iDescriptor-${{ inputs.version }}-${{ matrix.arch == 'x86_64' && 'Apple_Intel' || 'Apple_Silicon' }}.dmg

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: build/iDescriptor-${{ inputs.version }}-${{ matrix.arch == 'x86_64' && 'Apple_Intel' || 'Apple_Silicon' }}.dmg
          if-no-files-found: error
